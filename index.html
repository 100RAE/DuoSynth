<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUO — Web Audio Synth</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#1a1c21;--panel2:#22252b;--line:#353943;--text:#f1f1ee;--muted:#9a9da7;--accent:#c9f36a;--accent2:#8fbd35;--whitekey:#e8e7df;--blackkey:#25272d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#30342a 0%,#17181b 42%,#101114 75%);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);padding:28px 18px 40px}
.app{max-width:1050px;margin:0 auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:13px}.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#161911;font-weight:950;font-size:20px;letter-spacing:-2px}
.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--accent);font-weight:800;margin-bottom:4px}
h1{font-size:clamp(24px,4vw,34px);line-height:1;margin:0;letter-spacing:-.055em;font-weight:850}
.sub{color:var(--muted);font-size:12px;margin-top:8px}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:#666}.dot.on{background:var(--accent);box-shadow:0 0 12px #c9f36a88}
.panel{background:linear-gradient(145deg,#202228f5,#17191ef5);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 16px 40px #0002}
.modebar{display:flex;gap:8px;margin:0 0 18px}
.mode-btn{flex:1;background:#1a1c21;border:1px solid #353943;color:#8f939d;border-radius:10px;padding:12px 16px;font-size:11px;font-weight:850;letter-spacing:.14em}
.mode-btn.active{background:#c9f36a;color:#171a12;border-color:#c9f36a}
.wave-panel{display:none;margin-bottom:16px}
.waveform-mode .synth-only{display:none!important}
.waveform-mode .wave-panel{display:block}
.waveform-mode .octave-controls{display:none!important}
.wave-canvas-wrap{height:min(58vh,480px);min-height:260px;border:1px solid #353943;border-radius:14px;background:radial-gradient(ellipse at center,#1c2519,#101114 75%);overflow:hidden}
#waveCanvas{display:block;width:100%;height:100%}
.wave-meta{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:var(--muted);font-size:10px;letter-spacing:.12em}
.wave-dot{color:var(--accent)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.section-title{font-size:11px;letter-spacing:.18em;font-weight:800;color:#d8d9d2}
.section-note{font-size:11px;color:var(--muted)}
.controls{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
.knob-card{min-width:0;border:1px solid #30333a;border-radius:13px;background:#191b20;padding:12px 6px 10px;text-align:center}
.knob-card .num{font-size:9px;letter-spacing:.1em;color:#777d87;font-weight:800}
.knob{width:66px;height:66px;display:block;margin:9px auto 7px;touch-action:none;cursor:ns-resize;outline:none;-webkit-tap-highlight-color:transparent}
.knob:focus-visible{filter:drop-shadow(0 0 4px var(--accent))}
.knob-label{font-size:10px;font-weight:800;line-height:1.35;min-height:27px;display:flex;align-items:center;justify-content:center}
.knob-value{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px;font-weight:750;margin-top:5px}
.knob-hint{font-size:9px;color:#737782;margin-top:3px;min-height:12px}
.lower{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin:20px 0 12px}
.octave{display:flex;align-items:center;gap:8px}
.octave-label{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:800;margin-right:4px}
button{font:inherit;cursor:pointer}
.small-btn{background:#272a30;border:1px solid #424650;color:var(--text);border-radius:9px;padding:9px 13px;font-size:12px;font-weight:700}
.small-btn:hover{border-color:var(--accent);color:var(--accent)}
.octave-readout{font-variant-numeric:tabular-nums;min-width:74px;text-align:center;color:var(--accent);font-size:12px;font-weight:800}
.hint{font-size:11px;color:var(--muted);text-align:right}
.keyboard-panel{padding:18px 16px 20px;overflow:hidden}
.keys-wrap{overflow-x:auto;padding:0 0 5px;scrollbar-color:#4a4d53 #1a1c21}
.keyboard{position:relative;height:196px;min-width:620px;user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y;margin:0 auto}
.white-keys{display:flex;height:100%;width:100%}
.key{position:relative;cursor:pointer;transition:background .06s,transform .06s;touch-action:none;-webkit-tap-highlight-color:transparent}
.white{flex:1;min-width:0;background:linear-gradient(180deg,#f1f0e8,#d9d8d0);border:1px solid #a7a79f;border-radius:0 0 6px 6px;box-shadow:inset 0 -5px 0 #c6c5bd;color:#77796f;z-index:1}
.white.active{background:linear-gradient(180deg,#d9f69b,#a8d64d);box-shadow:inset 0 -5px 0 #8cb538}
.black{position:absolute;top:0;height:61%;width:5.7%;background:linear-gradient(120deg,#3a3d45,#16171b 70%);border:1px solid #08090b;border-radius:0 0 5px 5px;z-index:3;box-shadow:0 5px 5px #0007,inset 0 -4px 0 #101115;transform:translateX(-50%);color:#888c94}
.black.active{background:linear-gradient(120deg,#c9f36a,#7fae2e);color:#20251a}
.key-label{position:absolute;bottom:9px;left:0;right:0;text-align:center;font-size:10px;font-weight:750;pointer-events:none}
.black .key-label{bottom:7px;font-size:9px}
.key-shortcut{position:absolute;bottom:25px;left:0;right:0;text-align:center;font-size:9px;opacity:.58;pointer-events:none}
.black .key-shortcut{bottom:21px}
.footer{display:flex;justify-content:space-between;gap:12px;color:#747984;font-size:10px;margin-top:13px;flex-wrap:wrap}
kbd{font:inherit;border:1px solid #444852;border-radius:4px;padding:2px 5px;color:#b9bdc4;background:#202228}
@media(max-width:850px){.controls{grid-template-columns:repeat(4,minmax(0,1fr))}.knob-card{padding:12px 6px}.lower{grid-template-columns:1fr}.hint{text-align:left}}
@media(max-width:480px){body{padding:18px 10px 28px}.panel{padding:14px}.controls{gap:7px}.knob{width:58px;height:58px}.section-note{display:none}.status{font-size:9px}.keyboard{height:170px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">D2</div><div><h1>DUO SYNTH</h1></div></div>
  <div class="status"><span class="dot" id="audioDot"></span><span id="audioStatus">Audio ready on first note</span></div>
</header>

<nav class="modebar" aria-label="Display mode"><button class="mode-btn active" id="synthMode">SYNTH MOD</button><button class="mode-btn" id="waveMode">WAVEFORM MOD</button></nav>
<section class="panel wave-panel" id="wavePanel"><div class="section-head"><div class="section-title">OUTPUT WAVEFORM</div><span class="section-note">LIVE AUDIO</span></div><div class="wave-canvas-wrap"><canvas id="waveCanvas" aria-label="Live audio waveform"></canvas></div><div class="wave-meta"><span class="wave-dot" id="waveReadout">● LIVE SIGNAL</span><span>TIME DOMAIN</span></div></section>
<section class="panel synth-only">
  <div class="section-head"><div class="section-title">SOUND</div></div>
  <div class="controls" id="controls"></div>
</section>

<div class="lower">
  <div class="octave octave-controls"><span class="octave-label">KEY RANGE</span><button class="small-btn" id="octDown" aria-label="옥타브 내리기">− OCT</button><span class="octave-readout" id="octaveReadout">C4 — B5</span><button class="small-btn" id="octUp" aria-label="옥타브 올리기">+ OCT</button></div>
  <div class="octave"><button class="small-btn" id="midiConnect">MIDI CONNECT</button><span class="section-note" id="midiStatus">MIDI unavailable</span></div>
</div>

<section class="panel keyboard-panel synth-only">
  <div class="section-head"><div class="section-title">KEYBOARD</div></div>
  <div class="keys-wrap"><div class="keyboard" id="keyboard"><div class="white-keys" id="whiteKeys"></div><div id="blackKeys"></div></div></div>
  
</section>
</div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const waveformNames = ['SINE','TRIANGLE','SQUARE','SAWTOOTH'];
const waveTypes = ['sine','triangle','square','sawtooth'];
const defs = [
 {name:'OSC 1 WAVE',short:'WAVE',value:0,type:'wave',hint:'SAW'},
 {name:'OSC 1 LEVEL',short:'LEVEL',value:127,type:'level',hint:'VOLUME'},
 {name:'OSC 2 WAVE',short:'WAVE',value:0,type:'wave',hint:'TRI'},
 {name:'OSC 2 LEVEL',short:'LEVEL',value:0,type:'level',hint:'VOLUME'},
 {name:'ATTACK',short:'A',value:0,type:'adsr',hint:'0–2.0 SEC'},
 {name:'DECAY',short:'D',value:0,type:'adsr',hint:'0–2.0 SEC'},
 {name:'SUSTAIN',short:'S',value:127,type:'sustain',hint:'LEVEL'},
 {name:'RELEASE',short:'R',value:0,type:'release',hint:'0–3.0 SEC'}
];
const state = defs.map(d => d.value);
const knobs = [];
let audio = null, master = null, analyser = null, octave = 4;
let waveAnimationStarted = false;
const voices = new Map();
let midiAccess = null;
const midiHeld = new Map();
const midiNoteCounts = new Map();
function isMidiHolding(note){return (midiNoteCounts.get(note)||0)>0;}
function isKeyboardHolding(note){
 if([...pointerNotes.values()].some(n=>n===note))return true;
 for(const k of keyDown){if((octave+1)*12+keyMap[k]===note)return true;}
 return false;
}
const noteNames = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const whitePC = [0,2,4,5,7,9,11];
const keyMap = {'z':0,'s':1,'x':2,'d':3,'c':4,'v':5,'g':6,'b':7,'h':8,'n':9,'j':10,'m':11,',':12,'l':13,'.':14,';':15,'/':16,'q':12,'2':13,'w':14,'3':15,'e':16,'r':17,'5':18,'t':19,'6':20,'y':21,'7':22,'u':23};
const keyDown = new Set();

function makeKnob(index, def) {
 const card = document.createElement('div'); card.className = 'knob-card';
 const num = document.createElement('div'); num.className='num'; num.textContent=String(index+1).padStart(2,'0');
 const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('viewBox','0 0 72 72'); svg.setAttribute('class','knob'); svg.setAttribute('role','slider');
 svg.setAttribute('tabindex','0'); svg.setAttribute('aria-label',def.name); svg.setAttribute('aria-valuemin','0');svg.setAttribute('aria-valuemax','127');
 const bg = document.createElementNS(svg.namespaceURI,'circle'); bg.setAttribute('cx','36');bg.setAttribute('cy','36');bg.setAttribute('r','28');bg.setAttribute('fill','#292c32');bg.setAttribute('stroke','#41454e');bg.setAttribute('stroke-width','1.5');
 const arc = document.createElementNS(svg.namespaceURI,'path');arc.setAttribute('fill','none');arc.setAttribute('stroke','#c9f36a');arc.setAttribute('stroke-width','3');arc.setAttribute('stroke-linecap','round');
 const face = document.createElementNS(svg.namespaceURI,'circle');face.setAttribute('cx','36');face.setAttribute('cy','36');face.setAttribute('r','22');face.setAttribute('fill','#34373e');face.setAttribute('stroke','#454952');face.setAttribute('stroke-width','1');
 const pointer = document.createElementNS(svg.namespaceURI,'line');pointer.setAttribute('x1','36');pointer.setAttribute('y1','36');pointer.setAttribute('x2','36');pointer.setAttribute('y2','19');pointer.setAttribute('stroke','#f5f6ee');pointer.setAttribute('stroke-width','2.6');pointer.setAttribute('stroke-linecap','round');
 const center = document.createElementNS(svg.namespaceURI,'circle');center.setAttribute('cx','36');center.setAttribute('cy','36');center.setAttribute('r','3');center.setAttribute('fill','#c9f36a');
 svg.append(bg,arc,face,pointer,center);
 const label = document.createElement('div');label.className='knob-label';label.textContent=def.name;
 const value = document.createElement('div');value.className='knob-value';
 const hint = document.createElement('div');hint.className='knob-hint';hint.textContent=def.hint;
 card.append(num,svg,label,value,hint);$('controls').append(card);
 const item={svg,arc,pointer,value,hint,def,index};knobs.push(item);
 function set(v){state[index]=Math.max(0,Math.min(127,Math.round(v)));renderKnob(item);applyLiveControls();}
 let dragY=null,dragValue=0,dragPointer=null,moved=false;
 svg.addEventListener('pointerdown',e=>{e.preventDefault();dragY=e.clientY;dragValue=state[index];dragPointer=e.pointerId;moved=false;try{svg.setPointerCapture(e.pointerId)}catch(_){};});
 svg.addEventListener('pointermove',e=>{if(dragPointer===e.pointerId&&dragY!==null){if(Math.abs(e.clientY-dragY)>2)moved=true;set(dragValue+(dragY-e.clientY)*1.15);}});
 const endDrag=e=>{if(dragPointer===e.pointerId){dragY=null;dragPointer=null;}};
 svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
 svg.addEventListener('wheel',e=>{e.preventDefault();set(state[index]+(e.deltaY<0?1:-1)*Math.max(1,Math.round(Math.abs(e.deltaY)/35)));},{passive:false});
 svg.addEventListener('keydown',e=>{if(['ArrowUp','ArrowRight','ArrowDown','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();if(e.key==='Home')set(0);else if(e.key==='End')set(127);else set(state[index]+(['ArrowUp','ArrowRight'].includes(e.key)?1:-1));}});
 renderKnob(item);
}
function renderKnob(k){
 const v=state[k.index],angle=-135+(v/127)*270,rad=angle*Math.PI/180;
 const x=36+24*Math.sin(rad),y=36-24*Math.cos(rad);
 k.pointer.setAttribute('x2',x);k.pointer.setAttribute('y2',y);
 // The pointer angle is measured clockwise from 12 o'clock. Convert
 // that same angle convention to SVG's 3 o'clock-based arc coordinates.
 const start=(-135-90)*Math.PI/180,end=(angle-90)*Math.PI/180,r=28;
 const sx=36+r*Math.cos(start),sy=36+r*Math.sin(start),ex=36+r*Math.cos(end),ey=36+r*Math.sin(end);
 const large=(angle+135)>180?1:0;
 k.arc.setAttribute('d',`M ${sx} ${sy} A ${r} ${r} 0 ${large} 1 ${ex} ${ey}`);
 k.value.textContent=String(v).padStart(3,'0');k.svg.setAttribute('aria-valuenow',v);
 if(k.def.type==='wave'){const wi=Math.min(3,Math.floor(v/32));k.hint.textContent=waveformNames[wi];}
 else if(k.def.type==='level')k.hint.textContent=`${Math.round(v/127*100)}%`;
 else if(k.def.type==='adsr')k.hint.textContent=`${(v/127*2).toFixed(2)} SEC`;
 else if(k.def.type==='sustain')k.hint.textContent=`${Math.round(v/127*100)}%`;
 else if(k.def.type==='release')k.hint.textContent=`${(v/127*3).toFixed(2)} SEC`;
}
function waveIndex(i){return Math.min(3,Math.floor(state[i]/32));}
function attack(){return state[4]/127*2;}
function decay(){return state[5]/127*2;}
function sustain(){return state[6]/127;}
function release(){return state[7]/127*3;}
function initAudio(){
 if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){alert('이 브라우저는 Web Audio API를 지원하지 않습니다.');return false;}audio=new AC();master=audio.createGain();master.gain.value=.22;analyser=audio.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.72;master.connect(analyser);analyser.connect(audio.destination);}
 if(audio.state==='suspended')audio.resume();
 $('audioDot').classList.add('on');$('audioStatus').textContent='Audio engine active';return true;
}
function setMode(mode){
 const waveform=mode==='wave';document.body.classList.toggle('waveform-mode',waveform);
 $('synthMode').classList.toggle('active',!waveform);$('waveMode').classList.toggle('active',waveform);
 if(waveform){resizeWaveCanvas();if(!waveAnimationStarted){waveAnimationStarted=true;requestAnimationFrame(drawWaveform);}}
}
function resizeWaveCanvas(){
 const canvas=$('waveCanvas'),rect=canvas.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);
 if(!rect.width||!rect.height)return;
 const w=Math.round(rect.width*dpr),h=Math.round(rect.height*dpr);
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
}
function drawWaveform(){
 const canvas=$('waveCanvas'),ctx=canvas.getContext('2d');
 if(!canvas.width||!canvas.height)resizeWaveCanvas();
 const w=canvas.width,h=canvas.height,dpr=Math.max(1,window.devicePixelRatio||1);
 ctx.clearRect(0,0,w,h);
 ctx.strokeStyle='rgba(201,243,106,.09)';ctx.lineWidth=dpr;
 for(let i=1;i<8;i++){const x=w*i/8;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
 for(let i=1;i<5;i++){const y=h*i/5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
 ctx.strokeStyle='rgba(201,243,106,.2)';ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
 const data=new Uint8Array(analyser?analyser.fftSize:2048);if(analyser)analyser.getByteTimeDomainData(data);
 ctx.beginPath();ctx.lineWidth=2.4*dpr;ctx.strokeStyle='#c9f36a';ctx.shadowColor='#c9f36a';ctx.shadowBlur=13*dpr;
 for(let i=0;i<data.length;i++){const x=i/(data.length-1)*w,y=(data[i]/255)*h;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();ctx.shadowBlur=0;
 const active=voices.size>0;$('waveReadout').textContent=active?'● LIVE SIGNAL':'● WAITING FOR MIDI';$('waveReadout').style.opacity=active?'1':'.65';
 requestAnimationFrame(drawWaveform);
}
$('synthMode').addEventListener('click',()=>setMode('synth'));
$('waveMode').addEventListener('click',()=>setMode('wave'));
window.addEventListener('resize',()=>{if(document.body.classList.contains('waveform-mode'))resizeWaveCanvas();});
function midiFreq(note){return 440*Math.pow(2,(note-69)/12);}
function createVoice(note, velocity=127){
 if(!initAudio())return null;
 const ctx=audio,amp=ctx.createGain(),now=ctx.currentTime;
 amp.gain.setValueAtTime(0,now);amp.connect(master);
 const oscs=[];
 for(let i=0;i<2;i++){
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type=waveTypes[waveIndex(i===0?0:2)];osc.frequency.setValueAtTime(midiFreq(note),now);
  gain.gain.value=(state[i===0?1:3]/127)*.5;
  osc.connect(gain);gain.connect(amp);osc.start(now);oscs.push({osc,gain,index:i});
 }
 const a=attack(),d=decay(),s=sustain(),velocityGain=Math.max(0,Math.min(127,velocity))/127;
 amp.gain.setValueAtTime(0,now);amp.gain.linearRampToValueAtTime(velocityGain,now+Math.max(.005,a));
 amp.gain.setTargetAtTime(s*velocityGain,now+Math.max(.005,a),Math.max(.005,d/5||.005));
 const voice={note,amp,oscs,releasing:false,releaseTimer:null};voices.set(note,voice);return voice;
}
function disposeVoice(v){
 if(!v)return;
 if(v.releaseTimer)clearTimeout(v.releaseTimer);
 v.oscs.forEach(o=>{try{o.osc.stop()}catch(_){};try{o.osc.disconnect()}catch(_){};try{o.gain.disconnect()}catch(_){}});
 try{v.amp.disconnect()}catch(_){}
}
function noteOn(note,velocity=127){
 const existing=voices.get(note);
 if(existing){
  if(!existing.releasing)return;
  disposeVoice(existing);
  if(voices.get(note)===existing)voices.delete(note);
 }
 createVoice(note,velocity);updateKeyVisual(note,true);
}
function noteOff(note){
 const v=voices.get(note);if(!v||v.releasing)return;
 v.releasing=true;const now=audio.currentTime,r=release();
 v.amp.gain.cancelScheduledValues(now);
 const current=Math.max(.0001,v.amp.gain.value);
 v.amp.gain.setValueAtTime(current,now);v.amp.gain.setTargetAtTime(0,now,Math.max(.008,r/5||.008));
 const finish=Math.max(.06,r*1.5);
 v.releaseTimer=setTimeout(()=>{disposeVoice(v);if(voices.get(note)===v)voices.delete(note);},finish*1000+50);
 updateKeyVisual(note,false);
}
function applyLiveControls(){
 for(const [note,v] of voices){
  if(v.releasing)continue;
  v.oscs.forEach(o=>{const wi=o.index===0?0:2,li=o.index===0?1:3;o.osc.type=waveTypes[waveIndex(wi)];o.gain.gain.setTargetAtTime((state[li]/127)*.5,audio.currentTime,.015);});
 }
}
function updateKeyVisual(note,on){const el=document.querySelector(`[data-note="${note}"]`);if(el)el.classList.toggle('active',on);}
function buildKeyboard(){
 const whites=$('whiteKeys'),blacks=$('blackKeys');whites.innerHTML='';blacks.innerHTML='';
 for(let i=0;i<14;i++){
  const midi=(octave+1+Math.floor(i/7))*12+([0,2,4,5,7,9,11][i%7]);
  const pc=midi%12,el=document.createElement('div');el.className='key white';el.dataset.note=midi;
  const lab=document.createElement('div');lab.className='key-label';lab.textContent=noteNames[pc]+(Math.floor(midi/12)-1);el.append(lab);
  const shortcut=Object.keys(keyMap).find(k=>keyMap[k]===i&&k.length===1&&'zxcvbnm,'.includes(k));if(shortcut){const sh=document.createElement('div');sh.className='key-shortcut';sh.textContent=shortcut.toUpperCase();el.append(sh);}
  addPointerNote(el,midi);whites.append(el);
 }
 // Two octaves, 14 white keys. Place each black key over the boundary after its white key.
 const blackAfter=[0,1,3,4,5,7,8,10,11,12]; // white-key indices across two octaves
 blackAfter.forEach((wi,j)=>{
  const octaveOffset=wi>=7?12:0,pc=[1,3,6,8,10][j%5];
  const midi=(octave+1+Math.floor(wi/7))*12+pc;
  const el=document.createElement('div');el.className='key black';el.dataset.note=midi;
  el.style.left=`${((wi+1)/14)*100}%`;
  const lab=document.createElement('div');lab.className='key-label';lab.textContent=noteNames[pc];el.append(lab);
  addPointerNote(el,midi);blacks.append(el);
 });
 $('octaveReadout').textContent=`C${octave} — B${octave+1}`;
}
const pointerNotes = new Map();
function findKeyAtPoint(x,y){
 const stack=document.elementsFromPoint(x,y);
 for(const node of stack){
  if(node && node.classList && node.classList.contains('key') && node.dataset.note!==undefined)return node;
 }
 return null;
}
function pointerUsesNote(note,exceptId=null){
 for(const [id,n] of pointerNotes){if(id!==exceptId && n===note)return true;}
 return false;
}
function setPointerNote(pointerId,note){
 if(note===null || note===undefined)return;
 note=Number(note);
 const previous=pointerNotes.get(pointerId);
 if(previous===note)return;
 if(previous!==undefined){
  pointerNotes.delete(pointerId);
  if(!pointerUsesNote(previous)&&!isMidiHolding(previous))noteOff(previous);
 }
 pointerNotes.set(pointerId,note);
 noteOn(note);
}
function addPointerNote(el,note){
 // Track each pointer independently so multiple fingers can play different notes.
 el.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse' && e.button!==0)return;
  e.preventDefault();
  setPointerNote(e.pointerId,note);
  try{$('keyboard').setPointerCapture(e.pointerId);}catch(_){}
 });
}
$('keyboard').addEventListener('pointermove',e=>{
 if(!pointerNotes.has(e.pointerId))return;
 // Hit-test the pointer coordinates to support gliding across keys.
 const key=findKeyAtPoint(e.clientX,e.clientY);
 if(key)setPointerNote(e.pointerId,key.dataset.note);
});
function stopKeyboardPointer(e){
 const note=pointerNotes.get(e.pointerId);
 if(note===undefined)return;
 pointerNotes.delete(e.pointerId);
 if(!pointerUsesNote(note)&&!isMidiHolding(note))noteOff(note);
}
$('keyboard').addEventListener('pointerup',stopKeyboardPointer);
$('keyboard').addEventListener('pointercancel',stopKeyboardPointer);
$('keyboard').addEventListener('lostpointercapture',stopKeyboardPointer);
function midiNoteOn(source,note,velocity){
 const key=`${source}:${note}`;
 if(midiHeld.has(key))return;
 midiHeld.set(key,note);
 const count=(midiNoteCounts.get(note)||0)+1;midiNoteCounts.set(note,count);
 if(count===1)noteOn(note,velocity);
}
function midiNoteOff(source,note){
 const key=`${source}:${note}`;
 if(!midiHeld.has(key))return;
 midiHeld.delete(key);
 const count=Math.max(0,(midiNoteCounts.get(note)||1)-1);
 if(count)midiNoteCounts.set(note,count);else midiNoteCounts.delete(note);
 if(!count&&!isKeyboardHolding(note))noteOff(note);
}
function handleMIDIMessage(event,inputId){
 const data=event.data;if(!data||data.length<2)return;
 const status=data[0],command=status&0xF0,channel=status&0x0F,note=data[1],value=data.length>2?data[2]:0;
 const source=`${inputId||'midi'}:${channel}`;
 if(command===0x90&&value>0)midiNoteOn(source,note,value);
 else if(command===0x80||(command===0x90&&value===0))midiNoteOff(source,note);
 else if(command===0xB0){
  if(note>=70&&note<=77){const index=note-70;state[index]=value;renderKnob(knobs[index]);applyLiveControls();}
  else if(note===120||note===123){for(const [key,n] of [...midiHeld])if(key.startsWith(source+':'))midiNoteOff(source,n);}
 }
}
function attachMIDIInputs(){
 if(!midiAccess)return;
 for(const input of midiAccess.inputs.values()){
  input.onmidimessage=event=>handleMIDIMessage(event,input.id);
 }
 $('midiStatus').textContent=`${midiAccess.inputs.size} MIDI INPUT${midiAccess.inputs.size===1?'':'S'}`;
}
async function connectMIDI(){
 const button=$('midiConnect'),status=$('midiStatus');
 if(!navigator.requestMIDIAccess){status.textContent='Web MIDI unsupported';return;}
 button.disabled=true;status.textContent='Connecting…';
 try{
  midiAccess=await navigator.requestMIDIAccess({sysex:false});
  attachMIDIInputs();
  midiAccess.onstatechange=()=>attachMIDIInputs();
  status.textContent=midiAccess.inputs.size?`${midiAccess.inputs.size} MIDI INPUT${midiAccess.inputs.size===1?'':'S'}`:'No MIDI input';
 }catch(error){status.textContent='MIDI permission denied';}
 finally{button.disabled=false;}
}
$('midiConnect').addEventListener('click',connectMIDI);
function shiftOctave(delta){octave=Math.max(-1,Math.min(8,octave+delta));releaseAll();buildKeyboard();}
function releaseAll(){for(const n of [...voices.keys()])noteOff(n);keyDown.clear();pointerNotes.clear();document.querySelectorAll('.key.active').forEach(k=>k.classList.remove('active'));}
$('octDown').addEventListener('click',()=>shiftOctave(-1));$('octUp').addEventListener('click',()=>shiftOctave(1));
document.addEventListener('keydown',e=>{
 if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key==='ArrowUp'){shiftOctave(1);return;}if(e.key==='ArrowDown'){shiftOctave(-1);return;}
 const k=e.key.toLowerCase();if(Object.prototype.hasOwnProperty.call(keyMap,k)){e.preventDefault();const idx=keyMap[k];const note=(octave+1)*12+idx;if(!keyDown.has(k)){keyDown.add(k);noteOn(note);}}
});
document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(keyDown.has(k)){const idx=keyMap[k];keyDown.delete(k);const note=(octave+1)*12+idx;if(!isMidiHolding(note)&&!pointerUsesNote(note))noteOff(note);}});
window.addEventListener('blur',releaseAll);
defs.forEach((d,i)=>makeKnob(i,d));buildKeyboard();
})();
</script>
